name: zein-dev

services:
  postgres:
    # ECR Public throttles anonymous pulls; mirror.gcr.io serves the identical
    # postgres:17 manifest (see docs/ops/dependency-audit.md).
    image: mirror.gcr.io/library/postgres:17
    container_name: zein-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zein
      POSTGRES_USER: zein
      POSTGRES_PASSWORD: zein
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zein -d zein"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3mock:
    # Development/test only. MinIO CE is EOL and `minio/minio` was removed from
    # Docker Hub; production uses an external S3-compatible bucket.
    image: mirror.gcr.io/adobe/s3mock:latest
    container_name: zein-s3mock
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: zein-media
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9100:9090"
    volumes:
      - s3mockdata:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3mockdata: